<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - ToDoApp</title>
  <link rel="stylesheet" href="toDoApp.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand"><h1>ToDoApp</h1></div>
      <nav class="nav">
        <a href="homePage.html" class="nav-link">Home</a>
        <a href="register.html" class="nav-link">Register</a>
      </nav>
    </div>
  </header>

  <main class="auth-page container">
    <h2>Login</h2>
    <form id="loginForm" class="auth-form">
      <input type="text" id="username" placeholder="Username" required>
      <span id="usernameLoginError" class="error"></span>

      <input type="password" id="password" placeholder="Password" required>
      <span id="passwordLoginError" class="error"></span>

      <button type="submit" class="btn primary">Login</button>
    </form>
    <p><a href="forgetPassword.html">Forgot Password?</a></p>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> ToDoApp</p>
    </div>
  </footer>
  <script src="toDoApp.js"></script>
</body>
</html>
