<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - ToDoApp</title>
  <link rel="stylesheet" href="toDoApp.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand"><h1>ToDoApp</h1></div>
    </div>
  </header>

  <main class="auth-page container">
    <h2>Reset Password</h2>
    <form id="resetForm" class="auth-form">
      <input type="text" id="token" placeholder="Reset Token" required>
      <span id="resetTokenError" class="error"></span>

      <input type="password" id="newPassword" placeholder="New Password (min 6 chars)" required>
      <span id="resetNewPassError" class="error"></span>

      <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required>
      <span id="resetConfirmPassError" class="error"></span>

      <button type="submit" class="btn primary">Reset Password</button>
    </form>
    <p><a href="login.html">Back to Login</a></p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> ToDoApp</p>
    </div>
  </footer>
  <script src="toDoApp.js"></script>
</body>
</html>
